name: playersignal
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playersignal}
      POSTGRES_USER: ${POSTGRES_USER:-playersignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ../backend
    environment:
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-local}
      ALLOW_PAID_AI: ${ALLOW_PAID_AI:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lexical}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-v1}
      EMBEDDING_THRESHOLD: ${EMBEDDING_THRESHOLD:-0.78}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-local-rules-v1}
      ANALYSIS_MONTHLY_ATTEMPTS: ${ANALYSIS_MONTHLY_ATTEMPTS:-500}
      SYNC_HOURLY_LIMIT: ${SYNC_HOURLY_LIMIT:-12}
      ANALYSIS_MAX_REVIEWS: ${ANALYSIS_MAX_REVIEWS:-25}
      STEAM_MAX_PAGES: ${STEAM_MAX_PAGES:-10}
      STEAM_PAGE_DELAY_MS: ${STEAM_PAGE_DELAY_MS:-500}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-playersignal}
      POSTGRES_USER: ${POSTGRES_USER:-playersignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
  frontend:
    build: ../frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-playersignal_postgres_data}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
