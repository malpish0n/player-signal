# Optional overlay: use with infra/docker-compose.yml, after installing a local model.
services:
  backend:
    environment:
      OLLAMA_URL: http://ollama:11434
  ollama:
    image: ollama/ollama@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    profiles: [local-ai]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - local_models:/root/.ollama
    # Deliberately no host ports; use the private Compose network.
volumes:
  local_models:
